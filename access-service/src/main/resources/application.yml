spring:
  application:
    name: access-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/access}
    username: ${DB_USER:access}
    password: ${DB_PASSWORD:access}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate        # schema is owned by Flyway
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}

# App-specific
rbac:
  cache:
    l2-ttl: 10m                 # shared (Redis) grant cache TTL (ADR D5)
  audit:
    # partition retention is managed by ops, not here

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  # OTLP metrics export (OpenTelemetry, CNCF standard). Point at the platform's
  # OTel collector; Prometheus/Tempo remain backends *behind* the collector.
  otlp:
    metrics:
      export:
        endpoint: ${OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        # header:
        #   authorization: "Bearer ${OTLP_TOKEN:}"   # only if the collector requires auth

logging:
  level:
    com.example.rbac: INFO
